<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Atal Library</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .admin-login-box {
            width: 380px;
            max-width: 90%;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .admin-login-box h1 {
            text-align: center;

            color: #172554;

            margin-bottom: 8px;
        }

        .admin-login-box p {
            text-align: center;

            color: #666;

            margin-bottom: 25px;
        }

        .admin-login-box label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }

        .admin-login-box input {
            width: 100%;

            padding: 12px;

            margin-bottom: 18px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 15px;
        }

        .admin-login-box input:focus {
            outline: none;

            border-color: #2563eb;
        }

        .admin-login-box button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .admin-login-box button:hover {
            background: #1d4ed8;
        }

        .admin-login-box button:disabled {
            background: #93c5fd;

            cursor: not-allowed;
        }

        .back-btn {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #2563eb;

            text-decoration: none;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

        .status-message {
            display: none;

            margin-bottom: 18px;

            padding: 10px;

            border-radius: 8px;

            text-align: center;

            font-size: 14px;
        }

    </style>

</head>


<body>


    <div class="admin-login-box">

        <h1>Admin Login</h1>

        <p>Atal Library Administration</p>


        <div
            id="statusMessage"
            class="status-message">
        </div>


        <form id="adminLoginForm">


            <label for="adminUsername">
                Username
            </label>

            <input
                type="text"
                id="adminUsername"
                placeholder="Enter admin username"
                autocomplete="username"
                required
            >


            <label for="adminPassword">
                Password
            </label>

            <input
                type="password"
                id="adminPassword"
                placeholder="Enter admin password"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
                id="loginButton">

                Login as Admin

            </button>


        </form>


        <a
            href="index.html"
            class="back-btn">

            ← Back to Library

        </a>


    </div>


    <script>


        // ==================================================
        // BACKEND URL
        // ==================================================

        const API_URL =
            "https://atal-library-backend.onrender.com";


        // ==================================================
        // ELEMENTS
        // ==================================================

        const adminLoginForm =
            document.getElementById(
                "adminLoginForm"
            );


        const loginButton =
            document.getElementById(
                "loginButton"
            );


        const statusMessage =
            document.getElementById(
                "statusMessage"
            );


        // ==================================================
        // SHOW STATUS
        // ==================================================

        function showStatus(
            message,
            type = "error"
        ) {

            statusMessage.textContent =
                message;

            statusMessage.style.display =
                "block";


            if (type === "success") {

                statusMessage.style.background =
                    "#dcfce7";

                statusMessage.style.color =
                    "#166534";

            } else {

                statusMessage.style.background =
                    "#fee2e2";

                statusMessage.style.color =
                    "#991b1b";

            }

        }


        // ==================================================
        // HIDE STATUS
        // ==================================================

        function hideStatus() {

            statusMessage.style.display =
                "none";

        }


        // ==================================================
        // ADMIN LOGIN
        // ==================================================

        adminLoginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                hideStatus();


                const username =
                    document
                        .getElementById(
                            "adminUsername"
                        )
                        .value
                        .trim();


                const password =
                    document
                        .getElementById(
                            "adminPassword"
                        )
                        .value;


                // ------------------------------------------
                // VALIDATION
                // ------------------------------------------

                if (
                    !username ||
                    !password
                ) {

                    showStatus(
                        "Please enter username and password."
                    );

                    return;

                }


                // ------------------------------------------
                // BUTTON LOADING
                // ------------------------------------------

                loginButton.disabled =
                    true;

                loginButton.textContent =
                    "Logging in...";


                try {


                    console.log(
                        "Admin login request started..."
                    );


                    // IMPORTANT:
                    // Server route is /admin/login
                    const response =
                        await fetch(
                            `${API_URL}/admin/login`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json",

                                    "Accept":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        username:
                                            username,

                                        password:
                                            password

                                    })
                            }
                        );


                    console.log(
                        "Admin Login HTTP Status:",
                        response.status
                    );


                    const responseText =
                        await response.text();


                    let data = {};


                    try {

                        data =
                            responseText
                                ? JSON.parse(
                                    responseText
                                )
                                : {};

                    } catch (jsonError) {

                        console.error(
                            "Invalid JSON response:",
                            responseText
                        );

                        throw new Error(
                            "Invalid server response."
                        );

                    }


                    console.log(
                        "Admin Login Response:",
                        data
                    );


                    // --------------------------------------
                    // LOGIN FAILED
                    // --------------------------------------

                    if (!response.ok) {

                        showStatus(
                            data.message ||
                            data.error ||
                            "Invalid admin username or password."
                        );


                        loginButton.disabled =
                            false;

                        loginButton.textContent =
                            "Login as Admin";


                        return;

                    }


                    // --------------------------------------
                    // LOGIN SUCCESS
                    // --------------------------------------

                    showStatus(
                        data.message ||
                        "Admin login successful.",
                        "success"
                    );


                    // Save admin login status
                    sessionStorage.setItem(
                        "adminLoggedIn",
                        "true"
                    );


                    sessionStorage.setItem(
                        "adminUsername",
                        username
                    );


                    // Save token only if backend sends one
                    if (data.token) {

                        sessionStorage.setItem(
                            "adminToken",
                            data.token
                        );

                    }


                    loginButton.textContent =
                        "Login Successful";


                    // --------------------------------------
                    // REDIRECT TO ADMIN DASHBOARD
                    // --------------------------------------

                    setTimeout(
                        function () {

                            window.location.href =
                                "admin-dashboard.html";

                        },
                        500
                    );


                } catch (error) {


                    console.error(
                        "Admin Login Error:",
                        error
                    );


                    showStatus(
                        "Unable to connect to backend server. Please try again."
                    );


                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Login as Admin";

                }

            }
        );


    </script>


</body>

</html>
